<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>bKash Payment Confirmation — Messliner</title>
  <link rel="icon" type="image/png" href="assets/messLiner-logo.png">

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap"
    rel="stylesheet">

  <!-- Tailwind CSS & Lucide Icons -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- Environment Variables & Firebase SDK Compat -->
  <script src="js/env.js?v=1.0.0"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
  <script src="js/firebase-config.js?v=1.0.0"></script>
  <script src="js/shared/payment.js?v=1.0.0"></script>

  <!-- Vercel Web Analytics -->
  <script>
    window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };
  </script>
  <script defer src="/_vercel/insights/script.js"></script>

  <style>
    body {
      font-family: 'Plus Jakarta Sans', 'Inter', sans-serif;
      background: radial-gradient(circle at top, #fdf2f8 0%, #f8fafc 100%);
      min-height: 100vh;
    }

    .bkash-pink {
      color: #E2136E;
    }

    .bg-bkash {
      background: linear-gradient(135deg, #E2136E 0%, #D12053 100%);
    }

    .shadow-bkash {
      box-shadow: 0 10px 25px -5px rgba(226, 19, 110, 0.3);
    }

    @keyframes checkBounce {
      0% {
        transform: scale(0);
        opacity: 0;
      }

      50% {
        transform: scale(1.15);
        opacity: 1;
      }

      100% {
        transform: scale(1);
        opacity: 1;
      }
    }

    .animate-bounce-in {
      animation: checkBounce 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
    }
  </style>
</head>

<body class="flex items-center justify-center p-4 selection:bg-pink-500 selection:text-white">

  <!-- Card Container -->
  <div class="w-full max-w-lg bg-white rounded-3xl shadow-xl border border-slate-100 overflow-hidden relative"
    id="mainCard">

    <!-- Top Decorative Bar -->
    <div class="h-2 bg-bkash w-full"></div>

    <div class="p-6 sm:p-8" id="cardContent">
      <!-- Loading State -->
      <div id="stateLoading" class="flex flex-col items-center justify-center py-10 space-y-4">
        <div class="w-14 h-14 rounded-full border-4 border-pink-100 border-t-[#E2136E] animate-spin"></div>
        <div class="text-center">
          <h3 class="text-base font-bold text-slate-900">Verifying bKash Transaction...</h3>
          <p class="text-xs text-slate-500 mt-1">Please wait while your transaction is verified.</p>
        </div>
      </div>

      <!-- Success State (Rendered Dynamically) -->
      <div id="stateSuccess" class="hidden"></div>

      <!-- Failure / Cancelled State (Rendered Dynamically) -->
      <div id="stateFailure" class="hidden"></div>
    </div>

    <!-- Footer Security Badge -->
    <div
      class="bg-slate-50 px-6 py-3.5 border-t border-slate-100 flex items-center justify-between text-[11px] text-slate-400">
      <div class="flex items-center gap-1.5 font-medium">
        <i data-lucide="shield-check" class="h-3.5 w-3.5 text-emerald-600"></i>
        <span>Encrypted 256-Bit bKash Gateway</span>
      </div>
      <span class="font-bold tracking-wider text-slate-500">MESSLINER</span>
    </div>
  </div>

  <script>
    (async function () {
      const params = new URLSearchParams(window.location.search);
      const paymentStatus = (params.get("status") || "").toLowerCase(); // "success" | "failure" | "cancel"
      const paymentID = params.get("paymentID") || "";
      const trxID = params.get("trxID") || "";

      const stateLoading = document.getElementById("stateLoading");
      const stateSuccess = document.getElementById("stateSuccess");
      const stateFailure = document.getElementById("stateFailure");

      // Retrieve pending transaction details from localStorage
      let pending = {};
      try {
        pending = JSON.parse(localStorage.getItem("ml_pending_member_payment") || localStorage.getItem("ml_pending_universal_payment") || localStorage.getItem("ml_pending_bkash_recharge") || "{}");
      } catch (_) { }
      let pendingPreorder = {};
      try {
        pendingPreorder = JSON.parse(localStorage.getItem("ml_pending_pro_preorder") || "{}");
      } catch (_) { }

      // Forward member deposit / bill payment to in-app Ledger modal on dashboard.html
      if (pending.type === 'member_deposit' || pending.type === 'bill_payment' || localStorage.getItem('ml_pending_member_payment')) {
        const dest = 'dashboard.html?bkashPayment=auto&paymentID=' + encodeURIComponent(paymentID) + '&status=' + encodeURIComponent(paymentStatus) + '&trxID=' + encodeURIComponent(trxID);
        window.location.replace(dest);
        return;
      }

      const diningId = pending.diningId || localStorage.getItem("currentDiningId") || "";
      const rechargeAmount = parseFloat(pending.amount) || 0;
      const customerPhone = pending.phone || "";

      function renderIcons() {
        if (window.lucide) window.lucide.createIcons();
      }

      // ─── 1. SUCCESS FLOW (SECURE GATEWAY VERIFIED) ────────────────
      if (paymentStatus === "success") {
        const dedupeKey = "ml_bkash_done_" + (paymentID || trxID);
        const isMemberPayment = Boolean(pending.type === 'member_deposit' || pending.type === 'bill_payment');
        const isSubscription = !isMemberPayment && Boolean(pending.type && pending.type.startsWith('subscription'));
        const isPreorder = !isMemberPayment && !isSubscription && (pendingPreorder.type === 'pro_preorder' || pending.type === 'pro_preorder');
        const preData = pendingPreorder.type === 'pro_preorder' ? pendingPreorder : pending;
        const targetType = isMemberPayment ? pending.type : (isSubscription ? pending.type : (isPreorder ? 'pro_preorder' : 'sms_recharge'));
        const targetAmount = isMemberPayment ? (parseFloat(pending.amount) || 0) : (isSubscription ? (parseFloat(pending.amount) || 60) : (isPreorder ? (parseFloat(preData.amount) || 499) : rechargeAmount));

        let verifyResult = null;
        if (window.MesslinerPayment && paymentID) {
          try {
            verifyResult = await window.MesslinerPayment.verifyAndFulfill({
              paymentID: paymentID,
              trxID: trxID,
              type: targetType,
              diningId: diningId,
              amount: targetAmount,
              customerPhone: customerPhone || preData.phone || '',
              metadata: isSubscription ? (pending.metadata || {}) : (isMemberPayment ? (pending.metadata || {}) : (isPreorder ? {
                name: preData.name || 'Valued Customer',
                messName: preData.messName || 'Your Mess',
                email: preData.email || 'N/A',
                phone: preData.phone || customerPhone || 'N/A'
              } : {}))
            });

            if (verifyResult && verifyResult.alreadyProcessed) {
              // Already handled
            }
          } catch (vErr) {
            console.warn('[bKash Callback] Verification notice:', vErr);
          }
        }

        // Strict Security Guard: Payment must be verified by official bKash server
        const isVerifiedSuccess = Boolean(verifyResult && (verifyResult.success === true || verifyResult.alreadyProcessed === true));
        if (!isVerifiedSuccess) {
          stateLoading.classList.add("hidden");
          stateFailure.classList.remove("hidden");
          const errorMsg = (verifyResult && verifyResult.error) ? verifyResult.error : 'Payment could not be verified by the official bKash gateway. No balance was credited.';
          const returnUrl = isMemberPayment ? 'dashboard.html#user-bills' : 'dashboard.html#more';
          const returnLabel = isMemberPayment ? 'Return to Bills & Ledger' : 'Return to SMS Dashboard';

          stateFailure.innerHTML = `
            <div class="flex flex-col items-center text-center">
              <div class="w-16 h-16 rounded-full bg-rose-50 border-rose-200 text-rose-600 border-2 flex items-center justify-center mb-4 shadow-md">
                <i data-lucide="x" class="h-8 w-8 stroke-[2.5]"></i>
              </div>

              <span class="text-[10px] font-extrabold uppercase tracking-wider px-2.5 py-0.5 rounded-full bg-rose-100 text-rose-700 mb-2">
                VERIFICATION FAILED
              </span>

              <h2 class="text-xl font-extrabold text-slate-900">Payment Verification Failed</h2>
              <p class="text-xs text-slate-500 mt-1 max-w-sm">${errorMsg}</p>

              ${paymentID ? `
              <div class="w-full bg-slate-50 border border-slate-200 rounded-xl p-3 my-5 text-xs text-left">
                <div class="flex justify-between items-center text-slate-600">
                  <span>bKash Payment ID:</span>
                  <span class="font-mono font-bold text-slate-800">${paymentID}</span>
                </div>
              </div>` : ''}

              <div class="w-full mt-4 space-y-2">
                <a href="${returnUrl}" class="w-full flex items-center justify-center gap-2 py-3 px-6 rounded-xl text-white font-bold text-xs bg-slate-900 hover:bg-slate-800 transition-all shadow-md">
                  <i data-lucide="arrow-left" class="h-3.5 w-3.5"></i>
                  <span>${returnLabel}</span>
                </a>
              </div>
            </div>
          `;
          renderIcons();
          return;
        }

        const verifiedTrx = (verifyResult && verifyResult.trxID) || trxID || 'BKASH_CONFIRMED';
        const finalAmount = (verifyResult && verifyResult.amount) || targetAmount;

        // 0. MEMBER DEPOSIT / BILL PAYMENT FLOW
        if (isMemberPayment) {
          localStorage.setItem(dedupeKey, "1");
          localStorage.removeItem("ml_pending_member_payment");

          const isBill = pending.type === 'bill_payment';
          const meta = pending.metadata || {};
          const memberName = meta.userName || 'Member';
          const diningMess = meta.messName || 'Your Mess';
          const billName = meta.billTitle || 'Shared Bill';

          const now = new Date();
          const dateStr = `${String(now.getDate()).padStart(2, '0')}/${String(now.getMonth() + 1).padStart(2, '0')}/${now.getFullYear()} ${now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}`;

          stateLoading.classList.add("hidden");
          stateSuccess.classList.remove("hidden");
          stateSuccess.innerHTML = `
            <div class="flex flex-col items-center text-center">
              <div class="w-16 h-16 rounded-full bg-emerald-50 border-2 border-emerald-200 text-emerald-600 flex items-center justify-center mb-4 animate-bounce-in shadow-lg">
                <i data-lucide="check" class="h-9 w-9 stroke-[3]"></i>
              </div>

              <div class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full bg-pink-50 border border-pink-200 text-[#E2136E] text-xs font-bold mb-2">
                <i data-lucide="zap" class="h-3.5 w-3.5"></i>
                <span>bKash Auto Checkout</span>
              </div>

              <h2 class="text-xl font-extrabold text-slate-900 tracking-tight">
                ${isBill ? 'Bill Payment Successful!' : 'Balance Credited Instantly!'}
              </h2>
              <p class="text-xs text-slate-500 mt-1 max-w-sm">
                ${isBill ? 'Your shared bill has been verified and settled in the mess ledger.' : 'Your deposit was verified and automatically added to your mess balance.'}
              </p>

              <!-- Amount Card -->
              <div class="w-full bg-gradient-to-r from-pink-50/50 via-white to-pink-50/50 border border-pink-100 rounded-2xl p-4 my-5 text-center shadow-xs">
                <span class="text-[11px] font-bold text-slate-400 uppercase tracking-wider block">Amount Paid (bKash)</span>
                <div class="text-3xl font-black text-[#E2136E] mt-0.5">৳${finalAmount.toFixed(2)}</div>
                <span class="inline-block mt-1 text-xs font-bold text-emerald-700 bg-emerald-50 px-2.5 py-0.5 rounded-full border border-emerald-200/60">
                  ${isBill ? '✓ Status: Ledger Cleared' : '✓ Balance Added Instantly'}
                </span>
              </div>

              <!-- Breakdown Receipt -->
              <div class="w-full rounded-2xl bg-slate-50 border border-slate-200/80 p-4 space-y-2.5 text-xs text-left">
                <div class="flex justify-between items-center pb-2 border-b border-slate-200/60">
                  <span class="text-slate-500 font-medium">Member Name</span>
                  <span class="font-bold text-slate-900">${memberName}</span>
                </div>
                <div class="flex justify-between items-center pb-2 border-b border-slate-200/60">
                  <span class="text-slate-500 font-medium">Mess / Dining</span>
                  <span class="font-bold text-slate-900">${diningMess}</span>
                </div>
                ${isBill ? `
                <div class="flex justify-between items-center pb-2 border-b border-slate-200/60">
                  <span class="text-slate-500 font-medium">Bill Title</span>
                  <span class="font-bold text-purple-700">${billName}</span>
                </div>` : ''}
                <div class="flex justify-between items-center pb-2 border-b border-slate-200/60">
                  <span class="text-slate-500 font-medium">Transaction ID (TrxID)</span>
                  <span class="font-mono font-bold text-slate-900 bg-white px-2 py-0.5 rounded border border-slate-200">${verifiedTrx}</span>
                </div>
                <div class="flex justify-between items-center pb-2 border-b border-slate-200/60">
                  <span class="text-slate-500 font-medium">bKash Payment ID</span>
                  <span class="font-mono text-slate-700">${paymentID || 'N/A'}</span>
                </div>
                <div class="flex justify-between items-center">
                  <span class="text-slate-500 font-medium">Date &amp; Time</span>
                  <span class="text-slate-700 font-medium">${dateStr}</span>
                </div>
              </div>

              <!-- Action Button -->
              <div class="w-full mt-6 space-y-2">
                <a href="dashboard.html#user-bills" class="w-full flex items-center justify-center gap-2 py-3.5 px-6 rounded-xl text-white font-bold text-sm bg-bkash hover:opacity-95 shadow-bkash transition-all transform active:scale-[0.98]">
                  <i data-lucide="arrow-left" class="h-4 w-4"></i>
                  <span>Return to Bills &amp; Ledger History</span>
                </a>
              </div>
            </div>
          `;
          renderIcons();
          return;
        }
          const planName = subMeta.planName || (subMeta.plan === 'pay_as_you_go' ? 'Pay As You Go' : 'Messliner Pro');
          const billingCycle = subMeta.billingCycle || 'monthly';
          const cycleLabel = billingCycle === 'yearly' ? '1 Year (365 Days)' : '1 Month (30 Days)';

          localStorage.setItem(dedupeKey, "1");
          localStorage.removeItem("ml_pending_bkash_payment");

          const now = new Date();
          const dateStr = `${String(now.getDate()).padStart(2, '0')}/${String(now.getMonth() + 1).padStart(2, '0')}/${now.getFullYear()} ${now.toLocaleTimeString()}`;

          // Cache verified subscription details for Checkout Completed Screen & Slip Download
          const completedPayload = {
            plan: subMeta.plan || 'pro',
            planName: planName,
            billingCycle: billingCycle,
            cycleLabel: cycleLabel,
            amount: finalAmount,
            trxID: verifiedTrx,
            paymentID: paymentID,
            name: subMeta.name || 'Manager',
            phone: subMeta.phone || customerPhone || '',
            email: subMeta.email || '',
            messName: subMeta.messName || '',
            messAddress: subMeta.messAddress || '',
            diningId: diningId,
            timestamp: Date.now()
          };
          try {
            localStorage.setItem('ml_last_completed_subscription', JSON.stringify(completedPayload));
          } catch (_) { }

          // Redirect directly to the dedicated Completed UI on checkout.html
          window.location.replace(`checkout.html?status=success&paymentID=${encodeURIComponent(paymentID)}&trxID=${encodeURIComponent(verifiedTrx)}`);
          return;
        }

        // A. PRO PRE-ORDER FLOW
        if (isPreorder) {
          const custName = preData.name || 'Valued Customer';
          const custMess = preData.messName || 'Your Mess';
          const custPhone = preData.phone || customerPhone || 'N/A';
          const custEmail = preData.email || 'N/A';

          try {
            const alreadyProcessed = localStorage.getItem(dedupeKey);
            if (!alreadyProcessed && !verifyResult?.success) {
              await db.ref("preorders").push({
                plan: "Messliner Pro Annual (Pre-Order)",
                amount: finalAmount,
                name: custName,
                phone: custPhone,
                email: custEmail,
                messName: custMess,
                trxID: verifiedTrx,
                paymentID: paymentID || "",
                status: "paid",
                verified: true,
                createdAt: firebase.database.ServerValue.TIMESTAMP || Date.now()
              });
            }
            localStorage.setItem(dedupeKey, "1");
            localStorage.removeItem("ml_pending_pro_preorder");
            localStorage.removeItem("ml_pending_bkash_recharge");
          } catch (dbErr) {
            console.error("[bKash Callback] Preorder DB save error:", dbErr);
          }

          const now = new Date();
          const dateStr = `${String(now.getDate()).padStart(2, '0')}/${String(now.getMonth() + 1).padStart(2, '0')}/${now.getFullYear()} ${now.toLocaleTimeString()}`;

          stateLoading.classList.add("hidden");
          stateSuccess.classList.remove("hidden");
          stateSuccess.innerHTML = `
            <div class="flex flex-col items-center text-center">
              <div class="w-16 h-16 rounded-full bg-emerald-50 border-2 border-emerald-200 text-emerald-600 flex items-center justify-center mb-4 animate-bounce-in shadow-lg">
                <i data-lucide="check" class="h-9 w-9 stroke-[3]"></i>
              </div>

              <div class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full bg-emerald-50 border border-emerald-200 text-emerald-700 text-xs font-bold mb-2">
                <i data-lucide="sparkles" class="h-3.5 w-3.5"></i>
                <span>Pre-Order Confirmed</span>
              </div>

              <h2 class="text-xl font-extrabold text-slate-900 tracking-tight">Messliner Pro Pre-Order Successful!</h2>
              <p class="text-xs text-slate-500 mt-1">Thank you for securing your 1-Year VIP license. Your account will automatically activate with Pro features upon launch.</p>

              <div class="w-full bg-gradient-to-r from-pink-50/50 via-white to-pink-50/50 border border-pink-100 rounded-2xl p-4 my-5 text-center">
                <span class="text-[11px] font-bold text-slate-400 uppercase tracking-wider block">Pre-Order Amount Paid (bKash)</span>
                <div class="text-3xl font-black text-[#E2136E] mt-0.5">৳${finalAmount.toFixed(2)}</div>
                <span class="inline-block mt-1 text-xs font-bold text-emerald-700 bg-emerald-50 px-2.5 py-0.5 rounded-full">1 Year Annual License Secured</span>
              </div>

              <div class="w-full rounded-2xl bg-slate-50 border border-slate-200/80 p-4 space-y-2.5 text-xs text-left">
                <div class="flex justify-between items-center pb-2 border-b border-slate-200/60">
                  <span class="text-slate-500 font-medium">Customer Name</span>
                  <span class="font-bold text-slate-900">${custName}</span>
                </div>
                <div class="flex justify-between items-center pb-2 border-b border-slate-200/60">
                  <span class="text-slate-500 font-medium">Dining Mess Name</span>
                  <span class="font-bold text-slate-900">${custMess}</span>
                </div>
                <div class="flex justify-between items-center pb-2 border-b border-slate-200/60">
                  <span class="text-slate-500 font-medium">bKash Mobile</span>
                  <span class="font-mono text-slate-700">${custPhone}</span>
                </div>
                <div class="flex justify-between items-center pb-2 border-b border-slate-200/60">
                  <span class="text-slate-500 font-medium">Transaction ID (TrxID)</span>
                  <span class="font-mono font-bold text-slate-900 bg-white px-2 py-0.5 rounded border border-slate-200">${verifiedTrx}</span>
                </div>
                <div class="flex justify-between items-center pb-2 border-b border-slate-200/60">
                  <span class="text-slate-500 font-medium">Payment ID</span>
                  <span class="font-mono text-slate-700">${paymentID || 'N/A'}</span>
                </div>
                <div class="flex justify-between items-center">
                  <span class="text-slate-500 font-medium">Date &amp; Time</span>
                  <span class="text-slate-700 font-medium">${dateStr}</span>
                </div>
              </div>

              <div class="w-full mt-6 space-y-2">
                <a href="index.html" class="w-full flex items-center justify-center gap-2 py-3.5 px-6 rounded-xl text-white font-bold text-sm bg-bkash hover:opacity-95 shadow-bkash transition-all transform active:scale-[0.98]">
                  <i data-lucide="arrow-left" class="h-4 w-4"></i>
                  <span>Return to Messliner Home</span>
                </a>
              </div>
            </div>
          `;
          renderIcons();
          return;
        }

        // B. STANDARD SMS TOP-UP FLOW (Fulfillment executed securely by Serverless Edge Function)
        let updatedBalance = (verifyResult && verifyResult.updatedBalance) || 0;
        let perSmsRate = 0.30;

        try {
          if (diningId && finalAmount > 0) {
            // Fetch verified balance directly from Firebase RTDB
            const snap = await db.ref(`dinings/${diningId}/smsConfig`).once("value");
            const cfg = snap.val() || {};
            const liveBalance = parseFloat(cfg.smsBalance) || 0;
            perSmsRate = parseFloat(cfg.smsRate) || 0.30;

            if (updatedBalance === 0) {
              updatedBalance = liveBalance;
            }

            // Mark processed in local browser storage
            localStorage.setItem(dedupeKey, "1");
            localStorage.removeItem("ml_pending_bkash_recharge");
          }
        } catch (dbErr) {
          console.warn("[bKash Callback] DB balance fetch notice:", dbErr);
        }

        const estCredits = perSmsRate > 0 ? Math.floor(rechargeAmount / perSmsRate) : 0;
        const now = new Date();
        const dateStr = `${String(now.getDate()).padStart(2, '0')}/${String(now.getMonth() + 1).padStart(2, '0')}/${now.getFullYear()} ${now.toLocaleTimeString()}`;

        stateLoading.classList.add("hidden");
        stateSuccess.classList.remove("hidden");
        stateSuccess.innerHTML = `
          <div class="flex flex-col items-center text-center">
            <!-- Animated Success Icon -->
            <div class="w-16 h-16 rounded-full bg-emerald-50 border-2 border-emerald-200 text-emerald-600 flex items-center justify-center mb-4 animate-bounce-in shadow-lg">
              <i data-lucide="check" class="h-9 w-9 stroke-[3]"></i>
            </div>

            <div class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full bg-pink-50 border border-pink-200 text-[#E2136E] text-xs font-bold mb-2">
              <i data-lucide="zap" class="h-3.5 w-3.5"></i>
              <span>bKash Auto Checkout</span>
            </div>

            <h2 class="text-xl font-extrabold text-slate-900 tracking-tight">Payment Successful!</h2>
            <p class="text-xs text-slate-500 mt-1">Your mess SMS balance has been credited instantly.</p>

            <!-- Recharged Amount Display -->
            <div class="w-full bg-gradient-to-r from-pink-50/50 via-white to-pink-50/50 border border-pink-100 rounded-2xl p-4 my-5 text-center">
              <span class="text-[11px] font-bold text-slate-400 uppercase tracking-wider block">Recharged Amount</span>
              <div class="text-3xl font-black text-[#E2136E] mt-0.5">৳${rechargeAmount.toFixed(2)}</div>
              ${estCredits > 0 ? `<span class="inline-block mt-1 text-xs font-bold text-emerald-700 bg-emerald-50 px-2.5 py-0.5 rounded-full">≈ +${estCredits} Estimated SMS Added</span>` : ''}
            </div>

            <!-- Receipt Breakdown Table -->
            <div class="w-full rounded-2xl bg-slate-50 border border-slate-200/80 p-4 space-y-2.5 text-xs text-left">
              <div class="flex justify-between items-center pb-2 border-b border-slate-200/60">
                <span class="text-slate-500 font-medium">Transaction ID (TrxID)</span>
                <span class="font-mono font-bold text-slate-900 bg-white px-2 py-0.5 rounded border border-slate-200">${trxID || 'BKASH_CONFIRMED'}</span>
              </div>
              <div class="flex justify-between items-center pb-2 border-b border-slate-200/60">
                <span class="text-slate-500 font-medium">bKash Payment ID</span>
                <span class="font-mono text-slate-700">${paymentID || 'N/A'}</span>
              </div>
              ${updatedBalance > 0 ? `
              <div class="flex justify-between items-center pb-2 border-b border-slate-200/60">
                <span class="text-slate-500 font-medium">New SMS Balance</span>
                <span class="font-bold text-emerald-700 font-mono text-sm">৳${updatedBalance.toFixed(2)}</span>
              </div>` : ''}
              <div class="flex justify-between items-center">
                <span class="text-slate-500 font-medium">Timestamp</span>
                <span class="text-slate-700 font-medium">${dateStr}</span>
              </div>
            </div>

            <!-- Action Button -->
            <div class="w-full mt-6 space-y-2">
              <a href="dashboard.html#more" class="w-full flex items-center justify-center gap-2 py-3.5 px-6 rounded-xl text-white font-bold text-sm bg-bkash hover:opacity-95 shadow-bkash transition-all transform active:scale-[0.98]">
                <i data-lucide="arrow-left" class="h-4 w-4"></i>
                <span>Return to SMS Dashboard &amp; Logs</span>
              </a>
            </div>
          </div>
        `;
        renderIcons();
        return;
      }

      // ─── 2. CANCELLED / FAILED FLOW ──────────────────────────────
      // If this was a subscription payment, redirect to dedicated subscription-callback.html
      const isSub = Boolean((pending.type && pending.type.startsWith('subscription')) || localStorage.getItem('ml_pending_subscription'));
      if (isSub) {
        window.location.replace(`subscription-callback.html${window.location.search}`);
        return;
      }

      stateLoading.classList.add("hidden");
      stateFailure.classList.remove("hidden");

      const isMemberPayment = Boolean(pending.type === 'member_deposit' || pending.type === 'bill_payment');
      const isCancelled = paymentStatus === "cancel";
      const title = isCancelled ? "Payment Cancelled" : "Payment Incomplete";
      const desc = isCancelled
        ? "You cancelled the bKash checkout process. No money was deducted from your account."
        : "The bKash gateway was unable to complete the payment transaction. Please try again.";

      const returnUrl = isMemberPayment ? 'dashboard.html#user-bills' : 'dashboard.html#more';
      const tryAgainLabel = isMemberPayment ? 'Try Again from Bills Tab' : 'Try Again from SMS Dashboard';

      stateFailure.innerHTML = `
        <div class="flex flex-col items-center text-center">
          <div class="w-16 h-16 rounded-full ${isCancelled ? 'bg-amber-50 border-amber-200 text-amber-600' : 'bg-rose-50 border-rose-200 text-rose-600'} border-2 flex items-center justify-center mb-4 shadow-md">
            <i data-lucide="${isCancelled ? 'alert-triangle' : 'x'}" class="h-8 w-8 stroke-[2.5]"></i>
          </div>

          <span class="text-[10px] font-extrabold uppercase tracking-wider px-2.5 py-0.5 rounded-full ${isCancelled ? 'bg-amber-100 text-amber-700' : 'bg-rose-100 text-rose-700'} mb-2">
            ${isCancelled ? 'TRANSACTION CANCELLED' : 'PAYMENT FAILED'}
          </span>

          <h2 class="text-xl font-extrabold text-slate-900">${title}</h2>
          <p class="text-xs text-slate-500 mt-1 max-w-sm">${desc}</p>
          <div class="inline-flex items-center gap-1 text-[11px] font-semibold text-emerald-700 bg-emerald-50 px-3 py-1 rounded-full border border-emerald-200/70 mt-2">
            <i data-lucide="shield-check" class="w-3.5 h-3.5"></i>
            <span>আপনার বিকাশ একাউন্ট থেকে কোনো টাকা কাটা হয়নি</span>
          </div>

          ${paymentID ? `
          <div class="w-full bg-slate-50 border border-slate-200 rounded-xl p-3 my-5 text-xs text-left">
            <div class="flex justify-between items-center text-slate-600">
              <span>Reference Payment ID:</span>
              <span class="font-mono font-bold text-slate-800">${paymentID}</span>
            </div>
          </div>` : '<div class="my-3"></div>'}

          <div class="w-full mt-4 space-y-2">
            <a href="${returnUrl}" class="w-full flex items-center justify-center gap-2 py-3 px-6 rounded-xl text-white font-bold text-xs bg-slate-900 hover:bg-slate-800 transition-all shadow-md">
              <i data-lucide="rotate-ccw" class="h-3.5 w-3.5"></i>
              <span>${tryAgainLabel}</span>
            </a>
            ${isMemberPayment ? `
            <a href="dashboard.html" class="w-full flex items-center justify-center py-2.5 px-6 rounded-xl text-slate-600 font-semibold text-xs hover:bg-slate-100 transition-all">
              <span>Back to Home Dashboard</span>
            </a>` : ''}
          </div>
        </div>
      `;
      renderIcons();
    })();
  </script>

</body>

</html>
