        <section id="page-mealhistory" class="page-section">
          <div class="custom-subpage-container">
            <!-- Month Selector Card -->
            <div class="mh-month-selector-card">
              <button type="button" id="mhPrevMonthBtn" class="mh-month-arrow-btn"
                onclick="Messliner.userDashboard.changeMealHistoryMonth(-1)" aria-label="Previous Month">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
                  stroke-linecap="round" stroke-linejoin="round">
                  <polyline points="15 18 9 12 15 6"></polyline>
                </svg>
              </button>
              <span id="mhCurrentMonthLabel" class="mh-month-label">October 2026</span>
              <button type="button" id="mhNextMonthBtn" class="mh-month-arrow-btn"
                onclick="Messliner.userDashboard.changeMealHistoryMonth(1)" aria-label="Next Month">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
                  stroke-linecap="round" stroke-linejoin="round">
                  <polyline points="9 18 15 12 9 6"></polyline>
                </svg>
              </button>
            </div>

            <!-- Logs List -->
            <div class="mh-logs-scroll-area" id="userMealHistoryLogsContainer">
              <!-- Dynamically populated -->
            </div>
          </div>
        </section>
</body>
