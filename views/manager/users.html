        <section id="page-users" class="page-section">
          <div class="users-master-card fade-up">
            <div class="users-header">
              <div class="users-header-left">
                <div class="users-header-icon-box">
                  <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                    stroke-linecap="round" stroke-linejoin="round">
                    <path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2" />
                    <circle cx="9" cy="7" r="4" />
                    <path d="M23 21v-2a4 4 0 00-3-3.87" />
                    <path d="M16 3.13a4 4 0 010 7.75" />
                  </svg>
                </div>
                <div class="users-header-text">
                  <h2>Members</h2>
                  <p class="mt-1" id="usersSubtitle">Manage your dining members</p>
                </div>
              </div>
              <div class="flex gap-3 items-center">
                <div class="search-input-wrapper">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                    stroke-linejoin="round">
                    <circle cx="11" cy="11" r="8" />
                    <line x1="21" y1="21" x2="16.65" y2="16.65" />
                  </svg>
                  <input type="text" class="form-input" id="userSearchInput" placeholder="Search members..."
                    oninput="Messliner.users.filterUsers(this.value)">
                </div>
                <button class="btn btn-primary" onclick="Messliner.users.showAddModal()">
                  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                    stroke-linecap="round" stroke-linejoin="round">
                    <line x1="12" y1="5" x2="12" y2="19" />
                    <line x1="5" y1="12" x2="19" y2="12" />
                  </svg>
                  Add Member
                </button>
              </div>
            </div>
            <div id="usersGrid" class="users-grid">
              <div class="empty-state">
                <div class="empty-state-icon">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                    <path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2" />
                    <circle cx="9" cy="7" r="4" />
                    <path d="M23 21v-2a4 4 0 00-3-3.87" />
                    <path d="M16 3.13a4 4 0 010 7.75" />
                  </svg>
                </div>
                <h3>No Members Yet</h3>
                <p>Add members to start managing your dining.</p>
                <button class="btn btn-primary" onclick="Messliner.users.showAddModal()">Add First Member</button>
              </div>
            </div>
          </div>
        </section>
