                      <path
                        d="M12 2v4M12 18v4M4.93 4.93l2.83 2.83M16.24 16.24l2.83 2.83M2 12h4M18 12h4M4.93 19.07l2.83-2.83M16.24 7.76l2.83-2.83" />
                    </svg>
                  </div>
                  <div>
                    <h6 style="margin:0; font-size:0.75rem; font-weight:700; color:#0F2E1E;">AI Auto Meal System</h6>
                    <p style="margin:0; font-size:0.62rem; color:#6B7280;">Auto-toggles meals based on class routines
                    </p>

                        d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48" />

                    <line x1="22" y1="2" x2="11" y2="13" />

          <!-- ── AI Page Init Script ── -->
          <script>
            (function initAiPageUI() {
              // Expose greeting refresh globally
              window._aiRefreshGreeting = updateAiGreeting;

              // Greeting with username
              const userName = (window.Messliner && Messliner.history && Messliner.history.currentUserData && Messliner.history.currentUserData.name)
                || (window.Messliner && window.Messliner.state && window.Messliner.state.userName)
                || (window._aiLastUserName)
                || 'User';
              window._aiLastUserName = userName;

              const firstName = userName.split(' ')[0];
              const hour = new Date().getHours();
              let greeting = 'Good morning';
              if (hour >= 12 && hour < 17) greeting = 'Good afternoon';
              else if (hour >= 17) greeting = 'Good evening';

              if (nameEl) nameEl.textContent = `👋 Hello, ${firstName}!`;
              if (timeEl) timeEl.textContent = `${greeting}! How can I help you today?`;
              if (welcomeTitleEl) welcomeTitleEl.textContent = `Hello, ${userName}! 👋`;
              const welcomeSubEl = document.getElementById('aiWelcomeSub');
              if (welcomeSubEl) welcomeSubEl.textContent = `How can I help you today?`;

              // Customize the top header for AI Assistant page
              const headerTitle = document.getElementById('headerTitle');
              const headerSubtitle = document.getElementById('headerSubtitle');

              if (window.Messliner && window.Messliner.router && window.Messliner.router.currentPage === 'aiassistant') {
                if (headerTitle) {
                  headerTitle.textContent = 'Messliner AI';
                }
                if (headerSubtitle) {
                  headerSubtitle.textContent = '';
                  headerSubtitle.style.display = 'none';
                }
              }
            }

              // Try immediately, then retry when page is navigated to
              updateAiGreeting();
            setTimeout(updateAiGreeting, 800);

            // Hook into router navigation to refresh greeting & load chat sessions
            if (window.Messliner && window.Messliner.router) {
              const origNavigate = window.Messliner.router.navigate.bind(window.Messliner.router);
              window.Messliner.router.navigate = function (page) {
                origNavigate(page);
                if (page === 'aiassistant') {
                  setTimeout(updateAiGreeting, 300);
                  if (window._aiChatManager) {
                    window._aiChatManager.init();
                  }
                }
              };
            }

            // Bind the StartNewChat to our custom chat manager session creator
            window._aiStartNewChat = function () {
              if (window._aiChatManager) {
                window._aiChatManager.createNewSession();
              }
            };

            if (window.Messliner && window.Messliner.history) {
              window.Messliner.history._startNewAiChat = window._aiStartNewChat;
            }

            // Expose dynamic chat history manager
            window._aiChatManager = {
              sessions: [],
              currentSessionId: null,

              init() {
                if (!window.Messliner || !Messliner.history || !Messliner.history.userId) return;

                // Load from localStorage
                const stored = localStorage.getItem(`messliner_ai_sessions_${Messliner.history.userId}`);
                if (stored) {
                  try {
                    this.sessions = JSON.parse(stored);
                  } catch (e) {
                    this.sessions = [];
                  }
                }

                if (this.sessions.length === 0) {
                  this.createNewSession();
                } else {
                  this.currentSessionId = this.sessions[0].id;
                  this.renderSidebar();
                  this.loadSession(this.currentSessionId);
                }
              },

              createNewSession() {
                const newSession = {
                  id: 'session_' + Date.now(),
                  title: 'Current Session',
                  date: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
                  messages: []
                };
                this.sessions.unshift(newSession);
                this.currentSessionId = newSession.id;
                this.saveToStorage();
                this.renderSidebar();
                this.loadSession(newSession.id);
              },

              saveMessage(sender, text, timestamp) {
                const session = this.sessions.find(s => s.id === this.currentSessionId);
                if (!session) return;

                session.messages.push({ sender, text, timestamp });

                // Update title on first user message
                if (sender === 'user' && (session.title === 'Current Session' || session.title === 'New Chat')) {
                  session.title = text.length > 22 ? text.substring(0, 22) + '…' : text;
                }

                this.saveToStorage();
                this.renderSidebar();
              },

              loadSession(id) {
                this.currentSessionId = id;
                const session = this.sessions.find(s => s.id === id);
                if (!session) return;

                const win = document.getElementById('aiChatWindow');
                if (!win) return;

                // Clear chat window except welcome block
                const welcomeBlock = document.getElementById('aiWelcomeBlock');
                win.innerHTML = '';
                if (welcomeBlock) win.appendChild(welcomeBlock);

                if (session.messages.length === 0) {
                  if (welcomeBlock) welcomeBlock.style.display = 'flex';
                } else {
                  if (welcomeBlock) welcomeBlock.style.display = 'none';

                  session.messages.forEach(msg => {
                    const el = document.createElement('div');
                    if (msg.sender === 'user') {
                      el.className = 'ai-msg-row user-row';
                      el.innerHTML = `
                          <div style="display:flex;flex-direction:column;align-items:flex-end;max-width: 85%;">
                            <div class="ai-chat-bubble-user">${msg.text}</div>
                            <div class="ai-msg-time">${msg.timestamp}</div>
                          </div>
                        `;
                    } else {
                      el.className = 'ai-msg-row';
                      el.innerHTML = `
                          <div style="max-width: 85%;">
                            <div class="ai-chat-bubble-bot">${msg.text}</div>
                            <div class="ai-msg-time">${msg.timestamp}</div>
                          </div>
                        `;
                    }
                    win.appendChild(el);
                  });
                  requestAnimationFrame(() => { win.scrollTop = win.scrollHeight; });
                }

                this.renderSidebar();
              },

              deleteSession(id, event) {
                if (event) event.stopPropagation();
                if (this.sessions.length <= 1) {
                  // Clear messages instead of deleting the last session
                  const session = this.sessions[0];
                  session.title = 'Current Session';
                  session.messages = [];
                  this.saveToStorage();
                  this.loadSession(session.id);
                  return;
                }

                const idx = this.sessions.findIndex(s => s.id === id);
                if (idx !== -1) {
                  this.sessions.splice(idx, 1);
                  if (this.currentSessionId === id) {
                    this.currentSessionId = this.sessions[0].id;
                  }
                  this.saveToStorage();
                  this.loadSession(this.currentSessionId);
                }
              },

              saveToStorage() {
                localStorage.setItem(`messliner_ai_sessions_${Messliner.history.userId}`, JSON.stringify(this.sessions));
              },

              renderSidebar() {
                const list = document.getElementById('aiChatHistoryList');
                if (!list) return;

                list.innerHTML = '';
                this.sessions.forEach(s => {
                  const el = document.createElement('div');
                  el.className = `ai-history-item${s.id === this.currentSessionId ? ' active' : ''}`;
                  el.onclick = () => this.loadSession(s.id);

                  el.innerHTML = `
                      <div style="display:flex; justify-content:space-between; align-items:center; width:100%; gap:6px;">
                        <div style="overflow:hidden; flex:1;">
                          <div class="ai-history-title">${s.title}</div>
                          <div class="ai-history-date">${s.date}</div>
                        </div>
                        <button class="ai-history-del-btn" style="background:none; border:none; color:#EF4444; cursor:pointer; padding:2px; display:flex; align-items:center; transition:opacity 0.2s;" 
                                onclick="window._aiChatManager.deleteSession('${s.id}', event)">
                          <svg width="12" height="12" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
                            <polyline points="3 6 5 6 21 6" />
                            <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2" />
                          </svg>
                        </button>
                      </div>
                    `;
                  list.appendChild(el);
                });
              }
            };

            // Auto initialize on load if history module is ready
            setTimeout(function () {
              if (window._aiChatManager && window.Messliner && Messliner.history && Messliner.history.userId) {
                window._aiChatManager.init();
              }
            }, 800);
            }) ();
          </script>
        </section>
